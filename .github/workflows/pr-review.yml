name: Review IA des PR

# Le dépôt se relit avec sa propre action, sur la version de la branche
# (`uses: ./pr-review`) et non sur le tag publié : une régression du prompt ou
# du rendu se voit sur la PR qui l'introduit, avant d'être taguée.
#
# Sans secret `OLLAMA_API_KEY`, l'action le dit dans les logs et sort en 0.

on:
  pull_request:
    types: [opened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: 'Numéro de la PR à relire'
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  # Pour le statut « aristarque/review », qui fait attendre la review.
  statuses: write

concurrency:
  group: pr-review-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # Le mur vaut « le plus gros groupe séquencé + fusion ». Les passes ne
    # s'enchaînent que chez un provider qui cache les préfixes ; sur Ollama
    # elles restent parallèles, soit deux fois le « timeout-minutes » de
    # l'action. Avec une clé DeepSeek, trois fois. Plus la marge du commentaire
    # d'échec. Mesuré sur la PR #8 : 8 min 08 s au total, dont 470 s pour la
    # seule régression.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || format('refs/pull/{0}/head', inputs.pr) }}

      # Le bundle committé est exécuté tel quel, comme chez un consommateur.
      # La doctrine n'est pas nommée : `.github/copilot-instructions.md` fait
      # partie des chemins cherchés par défaut, et ce cas mérite d'être celui
      # qu'on éprouve à chaque PR.
      - uses: ./pr-review
        with:
          pr: ${{ github.event.pull_request.number || inputs.pr }}
          ollama-api-key: ${{ secrets.OLLAMA_API_KEY }}
          # Facultative, et absente aujourd'hui : sans elle, les trois appels
          # bon marché partent quand même, sur le deepseek-v4-flash d'Ollama.
          # La poser ajouterait le cache de préfixe de l'API directe.
          deepseek-api-key: ${{ secrets.DEEPSEEK_API_KEY }}
          skip: |
            */dist/**
          # Le dépôt éprouve son propre garde-fou : le statut n'est pas requis
          # ici (une PR de ce dépôt n'a pas d'auto-merge armé), mais le poser
          # vérifie à chaque PR qu'il se pose et qu'il se conclut.
          status-check: true

      - name: Signaler une review interrompue
        if: always() && (cancelled() || failure())
        continue-on-error: true
        uses: ./pr-review
        with:
          pr: ${{ github.event.pull_request.number || inputs.pr }}
          mode: abort
          status-check: true
