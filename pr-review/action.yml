name: 'Review IA de PR'
description: >-
  Relit une pull request en trois passes (régression, doctrine du dépôt, données
  et accès), et poste un commentaire de synthèse. Chaque passe choisit son
  provider et son modèle. Ne fait jamais échouer le job.
author: 'Julien Cruau'

branding:
  icon: 'eye'
  color: 'purple'

inputs:
  pr:
    description: "Numéro de la PR à relire."
    required: true

  enable:
    description: >-
      false : l'action sort tout de suite, sans lire la PR ni appeler le modèle.
      Interrupteur pour couper la review — quota épuisé, refonte en cours — sans
      démonter le workflow du dépôt. Le job reste vert.
    required: false
    default: 'true'

  ollama-api-key:
    description: >-
      Clé Ollama Cloud. Vide (PR venue d'un fork, secret non configuré) : la
      review est ignorée sans bruit et le job reste vert.
    required: false
    default: ''

  deepseek-api-key:
    description: >-
      Clé DeepSeek. Fait passer les trois appels bon marché du mix par l'API
      directe au lieu d'Ollama, ce qui ajoute un cache de préfixe automatique :
      « doctrine » et « données » partagent le même gros contexte, et la seconde
      le rejoue trente et une fois moins cher. Vide : le même modèle, servi par
      Ollama, sans cache.
    required: false
    default: ''

  openai-api-key:
    description: >-
      Clé du provider « openai » générique, pour un endpoint OpenAI-compatible
      quelconque (Fireworks, Z.ai, OpenRouter…). Inutile sans « openai-base-url ».
    required: false
    default: ''

  openai-base-url:
    description: >-
      Base du provider « openai » générique, par exemple
      https://api.fireworks.ai/inference/v1. Sans elle, ce provider est déclaré
      inutilisable plutôt que de viser api.openai.com par accident.
    required: false
    default: ''

  provider:
    description: >-
      Provider des passes qui n'en désignent pas d'autre : ollama, deepseek ou
      openai. Un identifiant inconnu est signalé et ignoré. ⚠️ En désigner un
      autre qu'ollama écarte le mix : le dépôt a pris la main, on ne renvoie pas
      ses passes ailleurs dans son dos.
    required: false
    default: 'ollama'

  github-token:
    description: "Jeton utilisé par le CLI gh. Le jeton du job suffit, avec pull-requests: write."
    required: false
    default: ${{ github.token }}

  model:
    description: >-
      Modèle du provider global, et donc de la seule passe « régression » quand
      le mix s'applique. Laissé vide : glm-5.2:cloud. ⚠️ L'écrire remet les
      QUATRE appels dessus : envoyer un modèle à un provider qui ne le sert pas
      produirait un 404, pas un compromis, donc un modèle nommé à la main écarte
      le mix entier. Pour n'en changer qu'une passe, « <passe>-model ».
    required: false
    default: ''

  regression-provider:
    description: "Provider de la passe « régression fonctionnelle ». Vide : celui du mix, sinon « provider »."
    required: false
    default: ''

  regression-model:
    description: "Modèle de la passe « régression fonctionnelle »."
    required: false
    default: ''

  regression-thinking:
    description: >-
      Raisonnement de la passe « régression fonctionnelle ». Écrit ici, il
      échappe au cran d'« effort ».
    required: false
    default: ''

  doctrine-provider:
    description: "Provider de la passe « doctrine du dépôt »."
    required: false
    default: ''

  doctrine-model:
    description: "Modèle de la passe « doctrine du dépôt »."
    required: false
    default: ''

  doctrine-thinking:
    description: "Raisonnement de la passe « doctrine du dépôt ». Échappe au cran d'« effort »."
    required: false
    default: ''

  data-provider:
    description: "Provider de la passe « données et accès »."
    required: false
    default: ''

  data-model:
    description: >-
      Modèle de la passe « données et accès ». Première escalade prévue si le
      recall y baisse sur de vraies PR : deepseek-v4-pro. ⚠️ Le changer sépare
      cette passe de « doctrine », qui perd alors leur cache commun.
    required: false
    default: ''

  data-thinking:
    description: "Raisonnement de la passe « données et accès ». Échappe au cran d'« effort »."
    required: false
    default: ''

  merge-provider:
    description: "Provider de la fusion."
    required: false
    default: ''

  merge-model:
    description: "Modèle de la fusion, qui trie sans avoir le code sous les yeux."
    required: false
    default: ''

  effort:
    description: >-
      Ampleur des coupes dans ce qui est envoyé au modèle : full, balanced ou
      lean. « full » envoie tout à toutes les passes ; la seule qu'il puisse
      sauter est « doctrine », sur un dépôt qui n'en fournit aucune, son prompt
      lui dictant alors sa sortie mot pour mot. « balanced » n'envoie les
      fichiers importés qu'aux passes qui s'en servent et ne lance pas une passe
      qu'une PR ne peut pas déclencher. « lean » resserre encore le contexte et
      baisse le raisonnement de deux crans sur « doctrine » et d'un cran sur
      « données et accès ». Aucun cran ne supprime la passe « données et
      accès », et tout ce qu'un cran retire est déclaré dans le commentaire.
      Nommé full/balanced/lean et non high/balanced/low pour ne pas se confondre
      avec « thinking », qui a déjà un « high » et un « low ».
    required: false
    default: 'balanced'

  passes:
    description: >-
      Passes à lancer, un identifiant par ligne parmi regression, doctrine et
      data. Vide : la règle d'« effort » décide. Une liste explicite court-circuite
      toutes les règles, y compris celles qui sauteraient une passe : utile sur un
      dépôt de contenu dont les .md SONT le produit, ou pour régler un prompt.
    required: false
    default: ''

  thinking:
    description: >-
      Effort de raisonnement des trois passes de lecture : low, medium, high,
      max, ou off. Laissé vide : max. Ce que chaque modèle accepte lui
      appartient : un niveau refusé retombe sur le raisonnement par défaut, un
      modèle qui n'en fait pas est relancé sans. Dans les deux cas la review
      continue, et le log le dit.
    required: false
    default: ''

  merge-thinking:
    description: >-
      Effort de raisonnement de la fusion, qui trie les trouvailles des trois
      passes sans avoir le code sous les yeux. Laissé vide : low quand le mix
      s'applique, high sinon. Plus bas que « thinking » à dessein : c'est la
      fusion qui s'ajoute au mur du job.
    required: false
    default: ''

  temperature:
    description: >-
      Ne pas mettre 0 : sur un modèle de raisonnement, le décodage glouton rend
      des reviews courtes et superficielles. Pour de la stabilité, garder cette
      valeur et fixer « seed ».
    required: false
    default: '1'

  seed:
    description: >-
      Graine d'échantillonnage, pour que deux lectures du même diff se
      ressemblent. « off » rend sa variance au modèle, utile pour relire une PR
      sous un autre angle.
    required: false
    default: '1'

  doctrine:
    description: >-
      Fichiers de conventions injectés dans le prompt système, un chemin par
      ligne, relatifs à la racine du dépôt. Ceux qui n'existent pas sont ignorés.
      Défaut : .github/copilot-instructions.md, CLAUDE.md, AGENTS.md.
    required: false
    default: ''

  skip:
    description: >-
      Motifs de fichiers à ne pas relire, un par ligne, syntaxe .gitignore
      (`src/generated/**`, `*.snap`, `deploy/`). S'AJOUTENT au socle intégré
      (lockfiles, binaires, node_modules), qui n'est pas désactivable.
    required: false
    default: ''

  project-summary:
    description: >-
      Deux ou trois lignes situant le projet, si le fichier de doctrine ne le
      fait pas déjà. Le plus souvent inutile.
    required: false
    default: ''

  max-findings:
    description: >-
      Nombre maximum de puces pour Bloquant, À corriger et Suggestions. La
      section « À vérifier » a son propre plafond de cinq.
    required: false
    default: '20'

  budget-chars:
    description: >-
      Plafond du contenu intégral des fichiers TOUCHÉS, en caractères. Les
      fichiers importés ont le leur, ci-dessous : ce n'est pas le total envoyé
      au modèle.
    required: false
    default: '500000'

  per-file-chars:
    description: "Plafond par fichier, pour qu'un gros fichier ne mange pas tout le budget."
    required: false
    default: '80000'

  window-min-lines:
    description: >-
      Taille en lignes à partir de laquelle un fichier touché part par extraits
      autour de ses changements, au lieu d'être envoyé en entier. Les numéros de
      ligne restent ceux du fichier, donc un chemin:ligne cité reste juste, et
      chaque trou est déclaré au modèle comme au lecteur. 0 désactive. Laissé
      vide, il vaut 0 au cran « full », 250 en « balanced » et 120 en « lean ».
    required: false
    default: ''

  imports-budget-chars:
    description: >-
      Plafond des fichiers que les fichiers touchés importent, joints en
      contexte pour que le modèle tranche un doute au lieu de le signaler. Budget
      distinct de « budget-chars » : les fichiers de la PR gardent le leur quoi
      qu'il arrive. 0 désactive le contexte importé. Laissé vide, il vaut 300000,
      ou 120000 au cran « lean » ; renseigné, il l'emporte sur le cran.
    required: false
    default: ''

  timeout-minutes:
    description: >-
      Délai maximum d'UNE requête au modèle. La review en fait quatre. Les
      passes tournent en parallèle, sauf celles qui partagent un provider ET un
      modèle CHEZ UN PROVIDER QUI CACHE LES PRÉFIXES : celles-là s'enchaînent,
      pour que la seconde rejoue le préfixe de la première. Le mur du job vaut
      donc « le groupe le plus lent, plus la fusion ». Le timeout-minutes du job
      doit rester au-dessus, sinon le commentaire d'échec n'a pas le temps
      d'être posté.
    required: false
    default: '15'

  dry-run:
    description: "true : la review est écrite dans les logs et rien n'est posté."
    required: false
    default: 'false'

runs:
  using: 'node24'
  main: 'dist/index.mjs'
