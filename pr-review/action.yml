name: 'Review IA de PR (Ollama)'
description: >-
  Relit une pull request avec un modèle Ollama Cloud en trois passes (régression,
  doctrine du dépôt, données et accès), et poste un commentaire de synthèse. Ne
  fait jamais échouer le job.
author: 'Julien Cruau'

branding:
  icon: 'eye'
  color: 'purple'

inputs:
  pr:
    description: "Numéro de la PR à relire."
    required: true

  enable:
    description: >-
      false : l'action sort tout de suite, sans lire la PR ni appeler le modèle.
      Interrupteur pour couper la review — quota épuisé, refonte en cours — sans
      démonter le workflow du dépôt. Le job reste vert.
    required: false
    default: 'true'

  ollama-api-key:
    description: >-
      Clé Ollama Cloud. Vide (PR venue d'un fork, secret non configuré) : la
      review est ignorée sans bruit et le job reste vert.
    required: false
    default: ''

  github-token:
    description: "Jeton utilisé par le CLI gh. Le jeton du job suffit, avec pull-requests: write."
    required: false
    default: ${{ github.token }}

  model:
    description: "Modèle Ollama Cloud."
    required: false
    default: 'glm-5.2:cloud'

  effort:
    description: >-
      Ampleur des coupes dans ce qui est envoyé au modèle : full, balanced ou
      lean. « full » envoie tout à toutes les passes ; la seule qu'il puisse
      sauter est « doctrine », sur un dépôt qui n'en fournit aucune, son prompt
      lui dictant alors sa sortie mot pour mot. « balanced » n'envoie les
      fichiers importés qu'aux passes qui s'en servent et ne lance pas une passe
      qu'une PR ne peut pas déclencher. « lean » resserre encore le contexte et
      baisse le raisonnement de deux crans sur « doctrine » et d'un cran sur
      « données et accès ». Aucun cran ne supprime la passe « données et
      accès », et tout ce qu'un cran retire est déclaré dans le commentaire.
      Nommé full/balanced/lean et non high/balanced/low pour ne pas se confondre
      avec « thinking », qui a déjà un « high » et un « low ».
    required: false
    default: 'balanced'

  passes:
    description: >-
      Passes à lancer, un identifiant par ligne parmi regression, doctrine et
      data. Vide : la règle d'« effort » décide. Une liste explicite court-circuite
      toutes les règles, y compris celles qui sauteraient une passe : utile sur un
      dépôt de contenu dont les .md SONT le produit, ou pour régler un prompt.
    required: false
    default: ''

  thinking:
    description: >-
      Effort de raisonnement des trois passes de lecture : low, medium, high,
      max, ou off. Ce que chaque modèle accepte lui appartient : un niveau refusé
      retombe sur le raisonnement par défaut, un modèle qui n'en fait pas est
      relancé sans. Dans les deux cas la review continue, et le log le dit.
    required: false
    default: 'max'

  merge-thinking:
    description: >-
      Effort de raisonnement de la fusion, qui trie les trouvailles des trois
      passes sans avoir le code sous les yeux. Plus bas que « thinking » à
      dessein : c'est la fusion qui s'ajoute au mur du job, les passes tournant
      en parallèle.
    required: false
    default: 'high'

  temperature:
    description: >-
      Ne pas mettre 0 : sur un modèle de raisonnement, le décodage glouton rend
      des reviews courtes et superficielles. Pour de la stabilité, garder cette
      valeur et fixer « seed ».
    required: false
    default: '1'

  seed:
    description: >-
      Graine d'échantillonnage, pour que deux lectures du même diff se
      ressemblent. « off » rend sa variance au modèle, utile pour relire une PR
      sous un autre angle.
    required: false
    default: '1'

  doctrine:
    description: >-
      Fichiers de conventions injectés dans le prompt système, un chemin par
      ligne, relatifs à la racine du dépôt. Ceux qui n'existent pas sont ignorés.
      Défaut : .github/copilot-instructions.md, CLAUDE.md, AGENTS.md.
    required: false
    default: ''

  skip:
    description: >-
      Motifs de fichiers à ne pas relire, un par ligne, syntaxe .gitignore
      (`src/generated/**`, `*.snap`, `deploy/`). S'AJOUTENT au socle intégré
      (lockfiles, binaires, node_modules), qui n'est pas désactivable.
    required: false
    default: ''

  project-summary:
    description: >-
      Deux ou trois lignes situant le projet, si le fichier de doctrine ne le
      fait pas déjà. Le plus souvent inutile.
    required: false
    default: ''

  max-findings:
    description: >-
      Nombre maximum de puces pour Bloquant, À corriger et Suggestions. La
      section « À vérifier » a son propre plafond de cinq.
    required: false
    default: '20'

  budget-chars:
    description: >-
      Plafond du contenu intégral des fichiers TOUCHÉS, en caractères. Les
      fichiers importés ont le leur, ci-dessous : ce n'est pas le total envoyé
      au modèle.
    required: false
    default: '500000'

  per-file-chars:
    description: "Plafond par fichier, pour qu'un gros fichier ne mange pas tout le budget."
    required: false
    default: '80000'

  window-min-lines:
    description: >-
      Taille en lignes à partir de laquelle un fichier touché part par extraits
      autour de ses changements, au lieu d'être envoyé en entier. Les numéros de
      ligne restent ceux du fichier, donc un chemin:ligne cité reste juste, et
      chaque trou est déclaré au modèle comme au lecteur. 0 désactive. Laissé
      vide, il vaut 0 au cran « full », 250 en « balanced » et 120 en « lean ».
    required: false
    default: ''

  imports-budget-chars:
    description: >-
      Plafond des fichiers que les fichiers touchés importent, joints en
      contexte pour que le modèle tranche un doute au lieu de le signaler. Budget
      distinct de « budget-chars » : les fichiers de la PR gardent le leur quoi
      qu'il arrive. 0 désactive le contexte importé. Laissé vide, il vaut 300000,
      ou 120000 au cran « lean » ; renseigné, il l'emporte sur le cran.
    required: false
    default: ''

  timeout-minutes:
    description: >-
      Délai maximum d'UNE requête au modèle. La review en fait quatre : trois
      passes en parallèle puis leur fusion, donc le mur du job vaut jusqu'à deux
      fois cette valeur. Le timeout-minutes du job doit rester au-dessus, sinon
      le commentaire d'échec n'a pas le temps d'être posté.
    required: false
    default: '15'

  dry-run:
    description: "true : la review est écrite dans les logs et rien n'est posté."
    required: false
    default: 'false'

runs:
  using: 'node24'
  main: 'dist/index.mjs'
