name: 'AI PR Review'
description: >-
  Reviews a pull request in three passes (regression, repo doctrine, data
  and access), then posts a summary comment. Each pass picks its own
  provider and model. Never fails the job.
author: 'Julien Cruau'

branding:
  icon: 'eye'
  color: 'purple'

inputs:
  pr:
    description: 'PR number to review.'
    required: true

  enable:
    description: >-
      false: the action exits immediately, without reading the PR or calling
      the model. A switch to turn the review off — exhausted quota, an
      ongoing rewrite — without dismantling the repo's workflow. The job
      stays green.
    required: false
    default: 'true'

  announce:
    description: >-
      Post a "review in progress" comment before the first model call, which
      the final report replaces in place. Two PRs were merged unreviewed
      because a PR with no comment couldn't tell "still running" from "never
      triggered": the announcement lifts the first case. Intended side
      effect: a PR reviewed several times keeps only the latest comment.
    required: false
    default: 'true'

  status-check:
    description: >-
      Sets a commit status (see "status-context") on the PR head: pending at
      start, success once the review lands, failure when it couldn't. This
      is the ONLY mechanism that makes the review blocking: a comment gates
      nothing, and an armed auto-merge goes ahead over a review still
      running. Declare the status as required in branch protection — a
      required but absent status also blocks, which catches the
      "ready_for_review" event GitHub never emitted. Needs "statuses: write"
      in the job permissions.
      ⚠️ Only enable this on a repo where the provider key is set: without a
      key, the action exits before posting anything, so the check stays
      absent and the merge stays blocked. A PR from a fork, which has no
      secrets, is in that case.
    required: false
    default: 'false'

  status-context:
    description: >-
      Name of the commit status. This is the exact string to write in
      branch protection to make the review blocking.
    required: false
    default: 'aristarque/review'

  mode:
    description: >-
      "review": normal work. "abort": read neither the PR nor the model, and
      only close out what a killed run left pending — the announcement
      switches to "review interrupted", the status to error. Wire it into a
      step with "if: always() && (cancelled() || failure())", or a run
      cancelled by cancel-in-progress leaves a pending status that blocks
      the merge forever.
    required: false
    default: 'review'

  ollama-api-key:
    description: >-
      Ollama Cloud key. Empty (PR from a fork, secret not configured): the
      review is skipped quietly and the job stays green.
    required: false
    default: ''

  deepseek-api-key:
    description: >-
      DeepSeek key. Routes the mix's three cheap calls through the direct
      API instead of Ollama, which adds an automatic prefix cache: "doctrine"
      and "data" share the same large context, and the second replays it
      thirty-one times cheaper. Empty: the same model, served by Ollama,
      without a cache.
    required: false
    default: ''

  openai-api-key:
    description: >-
      Key for the generic "openai" provider, for any OpenAI-compatible
      endpoint (Fireworks, Z.ai, OpenRouter…). Useless without
      "openai-base-url".
    required: false
    default: ''

  openai-base-url:
    description: >-
      Base URL of the generic "openai" provider, e.g.
      https://api.fireworks.ai/inference/v1. Without it, this provider is
      declared unusable rather than targeting api.openai.com by accident.
      Also name a "model": this endpoint has no known catalog, so no default.
    required: false
    default: ''

  openai-prefix-cache:
    description: >-
      true: the generic "openai" endpoint caches prefixes. Does NOT change
      the sequencing, which applies to every provider; it only changes the
      reported cost and the shared-prefix reading. False by default, because
      "OpenAI-compatible" describes a protocol, not a cache guarantee.
    required: false
    default: 'false'

  provider:
    description: >-
      Provider for the passes that don't name another one: ollama, deepseek,
      openai or aws. An unknown id is flagged and ignored. ⚠️ Naming
      anything but ollama drops the mix: the repo has taken over, so its
      passes aren't moved elsewhere behind its back.
    required: false
    default: 'ollama'

  aws-region:
    description: >-
      Bedrock region, e.g. eu-north-1, for the "aws" provider. Empty: this
      provider is unusable, like "openai" without "openai-base-url". Not
      every model is available in every region.
      Credentials are not set here: the action takes AWS_ACCESS_KEY_ID and
      AWS_SECRET_ACCESS_KEY when present, else the web identity token a
      Kubernetes runner mounts (AWS_WEB_IDENTITY_TOKEN_FILE + AWS_ROLE_ARN),
      else the aws CLI, which covers AWS_PROFILE and local SSO.
    required: false
    default: ''

  github-token:
    description: 'Token used by the gh CLI. The job''s own token is enough, with pull-requests: write.'
    required: false
    default: ${{ github.token }}

  model:
    description: >-
      Model of the global provider, and so of the "regression" pass alone
      when the mix applies. Left empty: glm-5.2:cloud. ⚠️ Writing it puts
      all FOUR calls on it: sending a model to a provider that doesn't serve
      it would return a 404, not a compromise, so a hand-named model drops
      the entire mix. To change only one pass, use "<pass>-model".
    required: false
    default: ''

  regression-provider:
    description: 'Provider of the "functional regression" pass. Empty: the mix''s, else "provider".'
    required: false
    default: ''

  regression-model:
    description: 'Model of the "functional regression" pass.'
    required: false
    default: ''

  regression-thinking:
    description: >-
      Reasoning effort of the "functional regression" pass. Written here,
      it escapes the "effort" tier.
    required: false
    default: ''

  doctrine-provider:
    description: 'Provider of the "repo doctrine" pass.'
    required: false
    default: ''

  doctrine-model:
    description: 'Model of the "repo doctrine" pass.'
    required: false
    default: ''

  doctrine-thinking:
    description: 'Reasoning effort of the "repo doctrine" pass. Escapes the "effort" tier.'
    required: false
    default: ''

  data-provider:
    description: 'Provider of the "data and access" pass.'
    required: false
    default: ''

  data-model:
    description: >-
      Model of the "data and access" pass. Planned first escalation if
      recall drops on real PRs: deepseek-v4-pro. ⚠️ Changing it separates
      this pass from "doctrine", which then loses their shared cache.
    required: false
    default: ''

  data-thinking:
    description: 'Reasoning effort of the "data and access" pass. Escapes the "effort" tier.'
    required: false
    default: ''

  merge-provider:
    description: 'Provider of the merge.'
    required: false
    default: ''

  merge-model:
    description: 'Model of the merge, which sorts without seeing the code.'
    required: false
    default: ''

  effort:
    description: >-
      How much gets cut from what is sent to the model: full, balanced or
      lean. "full" sends everything to every pass; the only one it can skip
      is "doctrine", on a repo that provides none, its prompt then dictating
      its output word for word. "balanced" sends imported files only to the
      passes that use them, and skips a pass a PR can't trigger. "lean"
      tightens the context further and drops reasoning by two tiers on
      "doctrine" and one on "data and access". No tier removes the "data and
      access" pass, and whatever a tier cuts is declared in the comment.
      Named full/balanced/lean rather than high/balanced/low to avoid
      confusion with "thinking", which already has a "high" and a "low".
    required: false
    default: 'balanced'

  passes:
    description: >-
      Passes to run, one id per line among regression, doctrine and data.
      Empty: the "effort" rule decides. An explicit list bypasses every
      rule, including those that would skip a pass: useful on a content repo
      whose .md files ARE the product, or to tune a prompt.
    required: false
    default: ''

  thinking:
    description: >-
      Reasoning effort of the three reading passes: low, medium, high, max,
      or off. Left empty: max. What each model accepts is its own business:
      a rejected level falls back to the model's default reasoning, a model
      that can't reason is retried without it. Either way the review
      continues, and the log says so.
    required: false
    default: ''

  merge-thinking:
    description: >-
      Reasoning effort of the merge, which sorts the three passes' findings
      without seeing the code. Left empty: low when the mix applies, high
      otherwise. Deliberately lower than "thinking": it's the merge that
      adds to the job's wall time.
    required: false
    default: ''

  temperature:
    description: >-
      Do not set to 0: on a reasoning model, greedy decoding produces short,
      shallow reviews. For stability, keep this value and set "seed"
      instead.
    required: false
    default: '1'

  seed:
    description: >-
      Sampling seed, so two readings of the same diff look alike. "off"
      gives the model back its variance, useful to re-read a PR from
      another angle.
    required: false
    default: '1'

  doctrine:
    description: >-
      Convention files injected into the system prompt, one path per line,
      relative to the repo root. Ones that don't exist are ignored. Default:
      .github/copilot-instructions.md, CLAUDE.md, AGENTS.md.
    required: false
    default: ''

  skip:
    description: >-
      File patterns not to review, one per line, .gitignore syntax
      (`src/generated/**`, `*.snap`, `deploy/`). ADD to the built-in floor
      (lockfiles, binaries, node_modules), which cannot be disabled.
    required: false
    default: ''

  project-summary:
    description: >-
      Two or three lines placing the project, if the doctrine file doesn't
      already. Usually unnecessary.
    required: false
    default: ''

  soft-sections:
    description: >-
      Post the "Suggestions" and "To verify" sections, which block nothing.
      Default "false": the report stops at "Blocking" and "To fix". Measured
      on avolo-shorts' last twenty PRs, 40 of 55 findings fell into these two
      sections against 15 actionable ones; sorting them is paid by whoever
      reviews, every single time. The reading passes still produce
      suggestions and doubts: the merge needs them to arbitrate severity, it
      just stops publishing them.
    required: false
    default: 'false'

  max-findings:
    description: >-
      Maximum number of bullets for Blocking, To fix and Suggestions. The
      "To verify" section has its own ceiling of five.
    required: false
    default: '20'

  budget-chars:
    description: >-
      Ceiling on the full content of TOUCHED files, in characters. Imported
      files have their own, below: this isn't the total sent to the model.
    required: false
    default: '500000'

  per-file-chars:
    description: 'Per-file ceiling, so one large file doesn''t eat the whole budget.'
    required: false
    default: '80000'

  window-min-lines:
    description: >-
      Line count above which a touched file is sent as excerpts around its
      changes, instead of in full. Line numbers stay the file's own, so a
      cited path:line stays correct, and every gap is declared to the model
      as to the reader. 0 disables it. Left empty: 0 at the "full" tier, 250
      at "balanced", 120 at "lean".
    required: false
    default: ''

  imports-budget-chars:
    description: >-
      Ceiling on the files touched files import, joined as context so the
      model settles a doubt instead of flagging it. A budget separate from
      "budget-chars": the PR's own files keep theirs regardless. 0 disables
      imported context. Left empty: 300000, or 120000 at the "lean" tier;
      set, it overrides the tier.
    required: false
    default: ''

  timeout-minutes:
    description: >-
      Maximum delay of ONE call to the model. The review makes four. Passes
      run in parallel, except ones that share both a provider AND a model:
      those always run in sequence, so the second replays the first's
      prefix when the provider caches, and because one model doesn't serve
      two large contexts at once when it doesn't cache. The job's wall time
      is therefore "(size of the largest group + 1) × this value": three
      times with the mix, where doctrine and data run in sequence, and FOUR
      times if a hand-written "model" puts all three passes back on a
      single model. The job's timeout-minutes must stay above this, or the
      failure comment has no time to be posted.
    required: false
    default: '15'

  max-output-tokens:
    description: >-
      Ceiling on a request's OUTPUT tokens. Not to be confused with
      "budget-chars", which bounds the input. Left empty, nothing is sent
      and the model keeps its own ceiling. Setting it bounds what a runaway
      call costs: measured on a model stuck in a reasoning loop, each lost
      attempt burned 65,536 tokens without returning a single character —
      four minutes of job time each time. Too low, it truncates a
      legitimate review on a large diff, which the action refuses to post.
    required: false
    default: ''

  dry-run:
    description: 'true: the review is written to the logs and nothing is posted.'
    required: false
    default: 'false'

runs:
  using: 'node24'
  main: 'dist/index.mjs'
